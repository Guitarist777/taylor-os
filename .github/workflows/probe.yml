name: probe the image
# A one-off look inside the built image (what is installed, what packages exist), run on pushes to probe/* branches.
on:
  push:
    branches: ["probe/**"]

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Make room
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
      - name: Pull the image
        run: |
          echo "${{ github.token }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman pull ghcr.io/guitarist777/taylor-os:latest
      - name: Look inside
        run: |
          podman run --rm -v "$PWD:/repo:ro" ghcr.io/guitarist777/taylor-os:latest bash /repo/.github/vm/probe.sh 2>&1 | tee probe.txt
      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: probe.txt

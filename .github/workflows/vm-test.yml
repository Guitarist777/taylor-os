name: test a full install in a virtual PC
# The test that was missing on install night (2026-11-18): install TAYLOR OS from Fedora's installer with the REAL
# kickstart into a virtual PC, start it, and check what she would see. The test install is then put in the state her PC
# was left in (text mode, Hyprland's example settings in her account), so the start-up repair is tested on that exact case.
# Test-only answers (disk, user, no Secure Boot key screen) are added to a COPY of the kickstart; the real one is unchanged.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "image tag to install (latest, or a test branch's tag)"
        required: true
        default: latest
      update_to:
        description: "optional: after the first start, update to this tag the way her PC does (signature checked), restart, then check"
        required: false
        default: ""

jobs:
  vm:
    name: Install, start, look
    runs-on: ubuntu-latest
    timeout-minutes: 200
    env:
      NETINST: Fedora-Everything-netinst-x86_64-45-1.4.iso
      CHECKSUM: Fedora-Everything-45-1.4-x86_64-CHECKSUM
      BASE_URL: https://dl.fedoraproject.org/pub/fedora/linux/releases/45/Everything/x86_64/iso
      TAG: ${{ inputs.tag }}
      UPDATE_TO: ${{ inputs.update_to }}
    steps:
      - uses: actions/checkout@v4

      - name: Room on the disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: KVM and QEMU
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 qemu-utils ovmf
          ls -l /dev/kvm /usr/share/OVMF/

      - name: The test kickstart (the real one plus test-only answers)
        run: |
          mkdir -p out
          sed "s#ghcr.io/guitarist777/taylor-os:latest#ghcr.io/guitarist777/taylor-os:${TAG}#g" installer/taylor-os.ks > test.ks
          cat >> test.ks <<'EOF'

          # ---- test only ----
          text
          lang en_US.UTF-8
          keyboard us
          timezone America/New_York
          zerombr
          clearpart --all --initlabel --disklabel=gpt
          autopart --type=btrfs --noswap
          bootloader --append="console=tty0 console=ttyS0,115200"
          rootpw --lock
          user --name=tester --password=taylortest --plaintext --groups=wheel
          poweroff

          %post
          # No Secure Boot in the test PC: cancel the key screen the real kickstart queued (it waits for a person forever).
          mokutil --revoke-import || :
          mokutil --timeout 0 || :
          # Put the install in the state her PC was left in on 2026-11-18, so the start-up repair is tested on it:
          systemctl set-default multi-user.target
          rm -f /home/tester/.config/hypr/hyprland.lua
          mkdir -p /home/tester/.config/hypr
          printf -- '-- This is an example Hyprland Lua config file.\n-- Refer to the wiki for more information.\n' > /home/tester/.config/hypr/hyprland.lua
          # and Bazzite's own welcome-window start-up file, as her account got it (the image's new copy already says KDE only)
          mkdir -p /home/tester/.config/autostart
          printf '[Desktop Entry]\nName=Bazzite Portal\nComment=Helps you setup Bazzite\nExec=yafti_gtk.py /usr/share/yafti/yafti.yml\nIcon=io.github.ublue_os.yafti_gtk\nTerminal=false\nType=Application\nX-GNOME-Autostart-enabled=true\n' > /home/tester/.config/autostart/bazzite-portal.desktop
          chown -R tester:tester /home/tester/.config
          %end
          EOF
          cp test.ks out/test.ks

      - name: Fedora's installer with the test kickstart
        run: |
          curl -fsSL -o "$NETINST" "$BASE_URL/$NETINST"
          curl -fsSL -o "$CHECKSUM" "$BASE_URL/$CHECKSUM"
          want=$(grep -E "^SHA256 \($NETINST\)" "$CHECKSUM" | awk '{print $NF}')
          test "$want" = "$(sha256sum "$NETINST" | awk '{print $1}')"
          docker run --rm --privileged -e NETINST -v /dev:/dev -v "$PWD:/w" -w /w registry.fedoraproject.org/fedora:45 bash -c '
            dnf install -y -q --setopt=install_weak_deps=False lorax xorriso pykickstart isomd5sum >/dev/null
            ksvalidator -v F45 test.ks
            mkksiso --ks test.ks -c "console=ttyS0,115200 inst.text" "$NETINST" test.iso
            implantisomd5 --force test.iso'
          rm -f "$NETINST"
          ls -lh test.iso

      - name: Install (unattended; the test PC turns itself off when done)
        run: |
          cp /usr/share/OVMF/OVMF_VARS_4M.fd vars.fd
          qemu-img create -f qcow2 disk.qcow2 60G
          timeout 100m qemu-system-x86_64 -enable-kvm -cpu host -machine q35 -smp 4 -m 8192 \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,file=vars.fd \
            -drive file=disk.qcow2,if=virtio -cdrom test.iso \
            -nic user,model=virtio -device virtio-vga -display none \
            -serial file:out/install-serial.log
          echo "exit $?"; tail -40 out/install-serial.log
          rm -f test.iso

      - name: First start, as her PC would
        run: |
          qemu-system-x86_64 -enable-kvm -cpu host -machine q35 -smp 4 -m 8192 \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,file=vars.fd \
            -drive file=disk.qcow2,if=virtio \
            -nic user,model=virtio -device virtio-vga -display none \
            -device qemu-xhci -device usb-tablet \
            -serial unix:/tmp/vm-serial.sock,server,nowait \
            -qmp unix:/tmp/vm-qmp.sock,server,nowait -daemonize -pidfile /tmp/vm.pid
          python3 .github/vm/vmctl.py wait-login 900
          sleep 60
          python3 .github/vm/vmctl.py shot "$PWD/out/1-after-start.png"

      - name: Update the way her PC does, then restart (only when update_to is given)
        if: ${{ inputs.update_to != '' }}
        run: |
          # Her PC was installed from an older image and follows :latest with the signature check on. Download the new image
          # through that same check, restart into it, and let every check below look at the updated PC.
          python3 .github/vm/vmctl.py run tester taylortest out/0-update.txt \
            "echo taylortest | sudo -S bootc status --booted 2>&1 | head -20" \
            "echo taylortest | sudo -S bootc switch --enforce-container-sigpolicy --transport registry ghcr.io/guitarist777/taylor-os:${UPDATE_TO} >/tmp/u.log 2>&1 && echo 'PASS the update downloads and its signature checks' || echo 'FAIL the update downloads and its signature checks'" \
            "tail -15 /tmp/u.log" \
            "echo taylortest | sudo -S bootc status 2>&1 | head -30" \
            "{ (sleep 5; echo taylortest | sudo -S systemctl reboot) >/dev/null 2>&1 & }"
          cat out/0-update.txt
          sleep 60
          python3 .github/vm/vmctl.py wait-login 900
          sleep 60
          python3 .github/vm/vmctl.py shot "$PWD/out/1b-after-update.png"
          python3 .github/vm/vmctl.py run tester taylortest out/0b-after-update.txt \
            "echo taylortest | sudo -S bootc status --booted --json 2>/dev/null | grep -q 'taylor-os:${UPDATE_TO}' && echo 'PASS the PC restarted into the update' || echo 'FAIL the PC restarted into the update'" \
            "echo taylortest | sudo -S bootc status --booted 2>&1 | head -20"
          cat out/0b-after-update.txt

      - name: What the test PC says about itself
        run: |
          python3 .github/vm/vmctl.py run tester taylortest out/2-checks.txt \
            "[ \"\$(systemctl get-default)\" = graphical.target ] && echo 'PASS starts in picture mode' || echo 'FAIL starts in picture mode'" \
            "systemctl is-active -q greetd.service && echo 'PASS the login screen is running' || echo 'FAIL the login screen is running'" \
            "journalctl -u taylor-heal --no-pager | grep -q 'TAYLOR desktop settings put in place' && echo 'PASS the repair put her desktop in place' || echo 'FAIL the repair put her desktop in place'" \
            "grep -q TAYLOR-OS-DESKTOP ~/.config/hypr/hyprland.lua && echo 'PASS her desktop file is the TAYLOR one' || echo 'FAIL her desktop file is the TAYLOR one'" \
            "ls ~/.config/hypr/hyprland.lua.example-* >/dev/null 2>&1 && echo 'PASS Hyprland example kept beside it' || echo 'FAIL Hyprland example kept beside it'" \
            "pgrep -u greetd -f '^(/usr/bin/)?quickshell -p /usr/share/taylor-os/greeter' >/dev/null && ! pgrep -u greetd tuigreet >/dev/null && echo 'PASS her login screen is the one showing' || echo 'FAIL her login screen is the one showing'" \
            "systemctl get-default" \
            "systemctl is-active display-manager.service greetd.service plasmalogin.service taylor-heal.service" \
            "journalctl -b -u taylor-heal --no-pager" \
            "ls -la ~/.config/hypr ~/.config/quickshell" \
            "head -4 ~/.config/hypr/hyprland.lua" \
            "rpm -q hyprland quickshell" \
            "ls /usr/share/wayland-sessions /usr/share/xsessions" \
            "echo taylortest | sudo -S sh -c 'readlink /etc/systemd/system/display-manager.service; pgrep -a -u greetd; cat /tmp/taylor-greeter-scene.log; cat /tmp/taylor-greeter-fails-*; journalctl -b -u greetd --no-pager | tail -30; cat /usr/lib/pam.d/greetd' 2>&1"
          cat out/2-checks.txt

      - name: Log in on the login screen and look at the desktop
        run: |
          python3 .github/vm/vmctl.py shot "$PWD/out/3-login-screen.png"
          python3 .github/vm/vmctl.py type 'wrongpass\n'
          sleep 3
          python3 .github/vm/vmctl.py shot "$PWD/out/3a-wrong-password.png"
          sleep 4
          python3 .github/vm/vmctl.py type 'taylortest'
          sleep 1
          python3 .github/vm/vmctl.py shot "$PWD/out/3b-typed.png"
          python3 .github/vm/vmctl.py type '\n'
          sleep 2
          python3 .github/vm/vmctl.py shot "$PWD/out/3c-welcome-back.png"
          # greetd's answer can arrive cut in half (a known Quickshell fault); after 8 s her login screen starts afresh and
          # asks for her password once more, and she types it again. So does the test, only then (2026-11-25, run 45558051962).
          sleep 14
          python3 .github/vm/vmctl.py run tester taylortest out/3c-fresh.txt \
            "grep -q 'fresh login scene' /tmp/taylor-greeter-times.log && ! pgrep -x -u tester Hyprland >/dev/null && echo FRESH-SCENE-ASKS-AGAIN || echo signed-in-first-time"
          if grep -qE 'FRESH-SCENE-ASKS-AGAIN\r?$' out/3c-fresh.txt; then   # the answer, not the typed command (it ends in signed-in-first-time)
            echo "the login screen started afresh after a lost answer; typing the password once more, as she would"
            sleep 4
            python3 .github/vm/vmctl.py type 'taylortest\n'
            sleep 2
          fi
          # her unlock (the dots rise, the desktop dial draws), then her arrival on the desktop
          for n in 3d 3e 3f 3g 3h; do
            sleep 2.5
            python3 .github/vm/vmctl.py shot "$PWD/out/$n-unlock.png"
          done
          sleep 72
          python3 .github/vm/vmctl.py shot "$PWD/out/4-after-login.png"
          python3 .github/vm/vmctl.py run tester taylortest out/5-desktop-checks.txt \
            "pgrep -x -u tester Hyprland >/dev/null && echo 'PASS logging in opens Hyprland' || echo 'FAIL logging in opens Hyprland'" \
            "pgrep -u tester -f '^(/usr/bin/)?quickshell' >/dev/null && echo 'PASS her desktop shell (quickshell) is running' || echo 'FAIL her desktop shell (quickshell) is running'" \
            "export HYPRLAND_INSTANCE_SIGNATURE=\$(ls /run/user/1000/hypr 2>/dev/null | head -1); hyprctl -j configerrors 2>/dev/null | tr -d ' \t\n' | grep -qxE '\[(\"\")?\]' && echo 'PASS Hyprland reports no settings errors' || echo 'FAIL Hyprland reports no settings errors'" \
            "hyprctl layers 2>/dev/null | grep -q taylor-dock && echo 'PASS the dock is on screen' || echo 'FAIL the dock is on screen'" \
            "hyprctl layers 2>/dev/null | grep -q taylor-dial && echo 'PASS her dial is on the desktop' || echo 'FAIL her dial is on the desktop'" \
            "hyprctl layers 2>/dev/null | grep -q taylor-arrival && echo 'FAIL her arrival ended and left the desktop' || echo 'PASS her arrival ended and left the desktop'" \
            "hyprctl layers 2>/dev/null | grep -q taylor-clock && echo 'PASS the clock is on screen' || echo 'FAIL the clock is on screen'" \
            "pgrep -u tester -f yafti_gtk >/dev/null && echo 'FAIL Bazzite welcome window stays shut' || echo 'PASS Bazzite welcome window stays shut'" \
            "grep -qx 'NotShowIn=Hyprland;' ~/.config/autostart/bazzite-portal.desktop && echo 'PASS the repair kept Bazzite welcome to KDE' || echo 'FAIL the repair kept Bazzite welcome to KDE'" \
            "hyprctl -j configerrors 2>&1" \
            "loginctl list-sessions --no-legend" \
            "for s in \$(loginctl list-sessions --no-legend | awk '{print \$1}'); do loginctl show-session \$s -p Type -p Desktop -p Service -p State; done" \
            "pgrep -a -u tester 'Hyprland|quickshell|hyprpaper|plasmashell|kwin'" \
            "ls /run/user/1000/hypr/ 2>&1" \
            "HYPRLAND_INSTANCE_SIGNATURE=\$(ls /run/user/1000/hypr | head -1) hyprctl -j configerrors 2>&1" \
            "HYPRLAND_INSTANCE_SIGNATURE=\$(ls /run/user/1000/hypr | head -1) hyprctl layers 2>&1 | head -60" \
            "tail -30 ~/.cache/hyprland/*.txt 2>/dev/null; ls ~/.cache/hyprland 2>&1" \
            "echo taylortest | sudo -S sh -c 'cat /tmp/taylor-greeter-times.log; tail -25 /tmp/taylor-greeter-scene.log; journalctl -b -u greetd --no-pager | tail -40'"
          cat out/5-desktop-checks.txt

      - name: Open a window and close it with the X on its own title bar (her pick 2026-11-23)
        run: |
          # Windows key + Enter opens the terminal; kitty draws no title bar, so Hyprland's own (hyprbars) gives it one
          python3 .github/vm/vmctl.py key meta_l-ret
          sleep 12
          python3 .github/vm/vmctl.py shot "$PWD/out/6-window-open.png"
          python3 .github/vm/vmctl.py run tester taylortest out/6-window.txt \
            "export HYPRLAND_INSTANCE_SIGNATURE=\$(ls /run/user/1000/hypr | head -1); hyprctl activewindow | grep -q 'class: kitty' && echo 'PASS a terminal window opens' || echo 'FAIL a terminal window opens'" \
            "hyprctl plugin list | grep -qi hyprbars && echo 'PASS every window has a title bar with minimise, full screen and close' || echo 'FAIL every window has a title bar with minimise, full screen and close'" \
            "hyprctl -j activewindow | python3 -c 'import json,sys; c=json.load(sys.stdin); x,y=c[\"at\"]; w,h=c[\"size\"]; print(\"CLOSEXY\", x+w-18, y-15)'" \
            "hyprctl -j monitors | python3 -c 'import json,sys; m=json.load(sys.stdin)[0]; print(\"SCREENWH\", m[\"width\"], m[\"height\"])'" \
            "hyprctl clients | grep -E 'class|title'"
          cat out/6-window.txt
          read -r cx cy < <(tr -d '\r' < out/6-window.txt | grep -oE 'CLOSEXY [0-9]+ [0-9]+' | tail -1 | cut -d' ' -f2-)
          read -r sw sh < <(tr -d '\r' < out/6-window.txt | grep -oE 'SCREENWH [0-9]+ [0-9]+' | tail -1 | cut -d' ' -f2-)
          # the X is the last button on the bar: its centre 18 px in from the window's right edge, 15 px above its top
          echo "clicking the X at $cx, $cy on $sw x $sh"
          python3 .github/vm/vmctl.py click "$cx" "$cy" "$sw" "$sh"
          sleep 5
          python3 .github/vm/vmctl.py shot "$PWD/out/7-after-x.png"
          python3 .github/vm/vmctl.py run tester taylortest out/7-closed.txt \
            "export HYPRLAND_INSTANCE_SIGNATURE=\$(ls /run/user/1000/hypr | head -1); hyprctl clients | grep -q 'class: kitty' && echo 'FAIL the X closes the window' || echo 'PASS the X closes the window'" \
            "hyprctl clients | grep -E 'class|title'"
          cat out/7-closed.txt

      - name: Her launcher, from a click on TAYLOR's dial (her design 2026-11-19)
        run: |
          # a fresh PC opens Steam's first-run box (a kdialog) over the dial: close it first, as she would
          python3 .github/vm/vmctl.py run tester taylortest out/7a-clear.txt "pkill -x kdialog; quickshell ipc --pid \$(pgrep -u tester -x quickshell | head -1) call notes clear; sleep 2; echo cleared"
          python3 .github/vm/vmctl.py run tester taylortest out/7b-dial.txt \
            "export HYPRLAND_INSTANCE_SIGNATURE=\$(ls /run/user/1000/hypr | head -1); hyprctl layers | grep taylor-dial | sed -E 's/.*xywh: ([0-9]+) ([0-9]+) ([0-9]+) ([0-9]+).*/DIALXYWH \\1 \\2 \\3 \\4/'" \
            "hyprctl -j monitors | python3 -c 'import json,sys; m=json.load(sys.stdin)[0]; print(\"SCREENWH\", m[\"width\"], m[\"height\"])'" \
            "grep -qF 'quickshell ipc call launcher toggle' ~/.config/hypr/hyprland.lua && echo 'PASS Windows key + Space is set to her launcher' || echo 'FAIL Windows key + Space is set to her launcher'"
          cat out/7b-dial.txt
          read -r dx dy dw dh < <(tr -d '\r' < out/7b-dial.txt | grep -oE 'DIALXYWH [0-9]+ [0-9]+ [0-9]+ [0-9]+' | tail -1 | cut -d' ' -f2-)
          read -r sw sh < <(tr -d '\r' < out/7b-dial.txt | grep -oE 'SCREENWH [0-9]+ [0-9]+' | tail -1 | cut -d' ' -f2-)
          # the ring's centre is the dial's spot: half way across its window, 390/900 of the screen down
          cx=$((dx + dw / 2)); cy=$((sh * 390 / 900))
          # (a look only) the mixer sits on the same desktop layer: does its Headphones button take a click?
          python3 .github/vm/vmctl.py click $((sw * 350 / 1280)) $((sh * 170 / 800)) "$sw" "$sh"
          sleep 2
          python3 .github/vm/vmctl.py shot "$PWD/out/7b2-mixer-headphones.png"
          echo "dial window $dx $dy $dw $dh on $sw x $sh: clicking $cx, $cy"
          python3 .github/vm/vmctl.py click $cx $cy "$sw" "$sh"
          sleep 3
          python3 .github/vm/vmctl.py shot "$PWD/out/7c-launcher-open.png"
          # (the console names her home /home/tester, her desktop /var/home/tester: the running desktop is found by its process)
          # the dial opens TAYLOR beside it, in the desktop itself (her brief, "TAYLOR in TaylorOS", 2026-11-25); then she is closed again
          python3 .github/vm/vmctl.py run tester taylortest out/7e-launcher.txt \
            "sleep 3; timeout 10 quickshell log --pid \$(pgrep -u tester -x quickshell | head -1) 2>&1 | grep -q 'the dial opens TAYLOR' && quickshell ipc --pid \$(pgrep -u tester -x quickshell | head -1) call taylor panel | grep -q 'open=true' && echo 'PASS a click on the dial opens TAYLOR beside it' || echo 'FAIL a click on the dial opens TAYLOR beside it'" \
            "quickshell ipc --pid \$(pgrep -u tester -x quickshell | head -1) call taylor close; sleep 2; echo closed" \
            "timeout 10 quickshell log --pid \$(pgrep -u tester -x quickshell | head -1) 2>&1 | grep -E 'taylor-(dial|desktop)' | tail -20" \
            "quickshell ipc --pid \$(pgrep -u tester -x quickshell | head -1) call launcher close; sleep 1; hyprctl layers | grep -q taylor-launcher && echo 'NOTE still open' || echo 'NOTE shut before the keys'"
          # Windows key + Space, as she would press it
          python3 .github/vm/vmctl.py key meta_l-spc
          sleep 3
          python3 .github/vm/vmctl.py run tester taylortest out/7e2-keys.txt \
            "export HYPRLAND_INSTANCE_SIGNATURE=\$(ls /run/user/1000/hypr | head -1); hyprctl layers | grep -q taylor-launcher && echo 'PASS Windows key + Space opens her launcher' || echo 'FAIL Windows key + Space opens her launcher'"
          python3 .github/vm/vmctl.py type 'kitt'
          sleep 2
          python3 .github/vm/vmctl.py shot "$PWD/out/7d-launcher-typed.png"
          python3 .github/vm/vmctl.py key ret
          sleep 1.2
          python3 .github/vm/vmctl.py shot "$PWD/out/7f-opening-status.png"
          sleep 8
          python3 .github/vm/vmctl.py shot "$PWD/out/7g-launched.png"
          python3 .github/vm/vmctl.py run tester taylortest out/7h-launched.txt \
            "export HYPRLAND_INSTANCE_SIGNATURE=\$(ls /run/user/1000/hypr | head -1); hyprctl clients | grep -q 'class: kitty' && echo 'PASS her launcher opens the app she picked' || echo 'FAIL her launcher opens the app she picked'" \
            "hyprctl layers | grep -q taylor-launcher && echo 'FAIL her launcher closes after she picks' || echo 'PASS her launcher closes after she picks'" \
            "cat ~/.local/state/taylor-os/launcher-recent.json; echo" \
            "pkill -x kitty; echo closed"
          cat out/7e-launcher.txt out/7e2-keys.txt out/7h-launched.txt

      - name: Her notifications, dots round the dial, the green count and her list (her design tour, part 5)
        run: |
          # Made-up notifications only. Nothing pops up: each becomes a dot round the dial and the green count by the clock.
          # Start from none waiting (Bazzite sends its own notice at first sign-in), and with Steam's first-run updater
          # shut (its window sat over the dial on run 44776081561).
          python3 .github/vm/vmctl.py run tester taylortest out/10-start.txt "pkill -u tester -f -i steam; quickshell ipc --pid \$(pgrep -u tester -x quickshell | head -1) call notes clear; sleep 3; echo cleared"
          python3 .github/vm/vmctl.py run tester taylortest out/10a-notes.txt \
            "export HYPRLAND_INSTANCE_SIGNATURE=\$(ls /run/user/1000/hypr | head -1); export DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus; o=\$(gdbus call --session --dest org.freedesktop.DBus --object-path /org/freedesktop/DBus --method org.freedesktop.DBus.GetConnectionUnixProcessID org.freedesktop.Notifications | grep -oE '[0-9]+' | tail -1); [ \"\$(cat /proc/\$o/comm 2>/dev/null)\" = quickshell ] && echo 'PASS her desktop receives notifications itself' || echo 'FAIL her desktop receives notifications itself'" \
            "gdbus call --session --dest org.freedesktop.Notifications --object-path /org/freedesktop/Notifications --method org.freedesktop.Notifications.Notify Test 0 '' 'Download finished' 'Game update is ready' '[]' '{}' 5000 >/dev/null; sleep 1.5; gdbus call --session --dest org.freedesktop.Notifications --object-path /org/freedesktop/Notifications --method org.freedesktop.Notifications.Notify Test 0 '' 'Timer done' '10 minute break is over' '[]' '{}' 5000 >/dev/null; sleep 1.5; gdbus call --session --dest org.freedesktop.Notifications --object-path /org/freedesktop/Notifications --method org.freedesktop.Notifications.Notify Test 0 '' 'Backup' 'Copy checked' '[]' '{}' 5000 >/dev/null; sleep 1.5; gdbus call --session --dest org.freedesktop.Notifications --object-path /org/freedesktop/Notifications --method org.freedesktop.Notifications.Notify Test 0 '' 'Chat' '3 new messages' '[]' '{}' 5000 >/dev/null; echo sent" \
            "sleep 2; n=\$(quickshell ipc --pid \$(pgrep -u tester -x quickshell | head -1) call notes waiting); [ \"\$n\" = 4 ] && echo 'PASS four notifications wait by her dial' || echo \"FAIL four notifications wait by her dial (\$n)\"" \
            "pgrep -x mako >/dev/null || hyprctl layers | grep -q 'namespace: notifications' && echo 'FAIL nothing pops up' || echo 'PASS nothing pops up'" \
            "export HYPRLAND_INSTANCE_SIGNATURE=\$(ls /run/user/1000/hypr | head -1); export DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus; hyprctl layers | grep taylor-tray | sed -E 's/.*xywh: ([0-9]+) ([0-9]+) ([0-9]+) ([0-9]+).*/TRAYXYWH \\1 \\2 \\3 \\4/'" \
            "export HYPRLAND_INSTANCE_SIGNATURE=\$(ls /run/user/1000/hypr | head -1); export DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus; hyprctl layers | grep taylor-dial | sed -E 's/.*xywh: ([0-9]+) ([0-9]+) ([0-9]+) ([0-9]+).*/DIALXYWH \\1 \\2 \\3 \\4/'" \
            "hyprctl -j monitors | python3 -c 'import json,sys; m=json.load(sys.stdin)[0]; print(\"SCREENWH\", m[\"width\"], m[\"height\"])'"
          cat out/10a-notes.txt
          python3 .github/vm/vmctl.py shot "$PWD/out/10a-four-waiting.png"
          read -r tx ty tw th < <(tr -d '\r' < out/10a-notes.txt | grep -oE 'TRAYXYWH( [0-9]+)+' | tail -1 | cut -d' ' -f2-)
          read -r dx dy dw dh < <(tr -d '\r' < out/10a-notes.txt | grep -oE 'DIALXYWH( [0-9]+)+' | tail -1 | cut -d' ' -f2-)
          read -r sw sh < <(tr -d '\r' < out/10a-notes.txt | grep -oE 'SCREENWH( [0-9]+)+' | tail -1 | cut -d' ' -f2-)
          # the green count is the tray's leftmost 32 pixels
          python3 .github/vm/vmctl.py click $((tx + 16)) $((ty + th / 2)) "$sw" "$sh"
          sleep 2
          python3 .github/vm/vmctl.py shot "$PWD/out/10b-list.png"
          python3 .github/vm/vmctl.py run tester taylortest out/10b-list.txt \
            "export HYPRLAND_INSTANCE_SIGNATURE=\$(ls /run/user/1000/hypr | head -1); export DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus; hyprctl layers | grep -q taylor-notes && echo 'PASS a click on the green count shows her list' || echo 'FAIL a click on the green count shows her list'" \
            "export HYPRLAND_INSTANCE_SIGNATURE=\$(ls /run/user/1000/hypr | head -1); export DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus; hyprctl layers | grep taylor-notes | sed -E 's/.*xywh: ([0-9]+) ([0-9]+) ([0-9]+) ([0-9]+).*/LISTXYWH \\1 \\2 \\3 \\4/'"
          cat out/10b-list.txt
          read -r lx ly lw lh < <(tr -d '\r' < out/10b-list.txt | grep -oE 'LISTXYWH( [0-9]+)+' | tail -1 | cut -d' ' -f2-)
          # the shortest line sits at the bottom, nearest the clock; its right end is the list's right edge
          python3 .github/vm/vmctl.py click $((lx + lw - 40)) $((ly + lh - 8 - 17)) "$sw" "$sh"
          sleep 3
          python3 .github/vm/vmctl.py shot "$PWD/out/10c-one-dismissed.png"
          python3 .github/vm/vmctl.py run tester taylortest out/10c-dismissed.txt "sleep 2; n=\$(quickshell ipc --pid \$(pgrep -u tester -x quickshell | head -1) call notes waiting); [ \"\$n\" = 3 ] && echo 'PASS a click on a line dismisses it' || echo \"FAIL a click on a line dismisses it (\$n)\""
          # a click on the empty desktop shuts the list
          python3 .github/vm/vmctl.py click $((sw * 45 / 100)) $((sh * 80 / 100)) "$sw" "$sh"
          sleep 2
          python3 .github/vm/vmctl.py run tester taylortest out/10d-away.txt "export HYPRLAND_INSTANCE_SIGNATURE=\$(ls /run/user/1000/hypr | head -1); export DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus; hyprctl layers | grep -q taylor-notes && echo 'FAIL a click away shuts her list' || echo 'PASS a click away shuts her list'"
          # with some waiting, a click on the dial still opens TAYLOR (beside her, 2026-11-25); her list stays shut (the count by the clock opens it)
          python3 .github/vm/vmctl.py click $((dx + dw / 2)) $((sh * 390 / 900)) "$sw" "$sh"
          sleep 4
          python3 .github/vm/vmctl.py shot "$PWD/out/10e-dial-list.png"
          python3 .github/vm/vmctl.py run tester taylortest out/10e-dial.txt \
            "export HYPRLAND_INSTANCE_SIGNATURE=\$(ls /run/user/1000/hypr | head -1); ! hyprctl layers | grep -q taylor-notes && quickshell ipc --pid \$(pgrep -u tester -x quickshell | head -1) call taylor panel | grep -q 'open=true' && echo 'PASS a click on the dial opens TAYLOR while some wait' || echo 'FAIL a click on the dial opens TAYLOR while some wait'" \
            "quickshell ipc --pid \$(pgrep -u tester -x quickshell | head -1) call taylor close; sleep 2; echo closed"
          # at most five wait (a sixth sends the oldest away), and an app that takes one back takes its dot away
          python3 .github/vm/vmctl.py run tester taylortest out/10f-five.txt \
            "export HYPRLAND_INSTANCE_SIGNATURE=\$(ls /run/user/1000/hypr | head -1); export DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus; gdbus call --session --dest org.freedesktop.Notifications --object-path /org/freedesktop/Notifications --method org.freedesktop.Notifications.Notify Test 0 '' 'One' 'more' '[]' '{}' 5000 >/dev/null; gdbus call --session --dest org.freedesktop.Notifications --object-path /org/freedesktop/Notifications --method org.freedesktop.Notifications.Notify Test 0 '' 'Two' 'more' '[]' '{}' 5000 >/dev/null; gdbus call --session --dest org.freedesktop.Notifications --object-path /org/freedesktop/Notifications --method org.freedesktop.Notifications.Notify Test 0 '' 'Three' 'more' '[]' '{}' 5000 >/dev/null; echo sent" \
            "sleep 2; n=\$(quickshell ipc --pid \$(pgrep -u tester -x quickshell | head -1) call notes waiting); [ \"\$n\" = 5 ] && echo 'PASS at most five wait' || echo \"FAIL at most five wait (\$n)\"" \
            "i=\$(gdbus call --session --dest org.freedesktop.Notifications --object-path /org/freedesktop/Notifications --method org.freedesktop.Notifications.Notify Test 0 '' 'Taken' 'back' '[]' '{}' 5000 | grep -oE '[0-9]+' | tail -1); sleep 1; gdbus call --session --dest org.freedesktop.Notifications --object-path /org/freedesktop/Notifications --method org.freedesktop.Notifications.CloseNotification \$i >/dev/null; echo closed \$i" \
            "sleep 2; n=\$(quickshell ipc --pid \$(pgrep -u tester -x quickshell | head -1) call notes waiting); [ \"\$n\" = 4 ] && echo 'PASS an app taking one back takes its dot away' || echo \"FAIL an app taking one back takes its dot away (\$n)\""
          python3 .github/vm/vmctl.py shot "$PWD/out/10f-after.png"
          cat out/10c-dismissed.txt out/10d-away.txt out/10e-dial.txt out/10f-five.txt

      - name: Sign out, and watch her opening play on the login screen
        run: |
          # Signing out ends her desktop; greetd shows her login screen again, from the opening.
          python3 .github/vm/vmctl.py run tester taylortest out/8-signout.txt \
            "s=\$(loginctl list-sessions --no-legend | awk '\$3==\"tester\" && \$4==\"seat0\" {print \$1}' | head -1); echo session \$s; echo taylortest | sudo -S loginctl terminate-session \$s"
          cat out/8-signout.txt
          for at in 3 8 13 19 27; do
            sleep 5
            python3 .github/vm/vmctl.py shot "$PWD/out/9-opening-$at.png"
          done
          python3 .github/vm/vmctl.py run tester taylortest out/9-opening.txt \
            "pgrep -u greetd -f '^(/usr/bin/)?quickshell -p /usr/share/taylor-os/greeter' >/dev/null && echo 'PASS her login screen comes back after signing out' || echo 'FAIL her login screen comes back after signing out'" \
            "echo taylortest | sudo -S cat /tmp/taylor-greeter-scene.log"
          cat out/9-opening.txt

      - name: The KDE backup sign-in, F2 on her login screen (her build brief)
        run: |
          # F2 before the password: the hint says KDE next, and this sign-in opens KDE Plasma instead of her TAYLOR desktop.
          python3 .github/vm/vmctl.py key f2
          sleep 3
          python3 .github/vm/vmctl.py shot "$PWD/out/11a-kde-next.png"
          python3 .github/vm/vmctl.py type 'taylortest'
          sleep 1
          python3 .github/vm/vmctl.py type '\n'
          sleep 60
          python3 .github/vm/vmctl.py shot "$PWD/out/11b-kde.png"
          python3 .github/vm/vmctl.py run tester taylortest out/11-kde.txt \
            "echo taylortest | sudo -S grep -q 'next sign-in opens the KDE backup' /tmp/taylor-greeter-scene.log && echo 'PASS F2 on her login screen picks the KDE backup' || echo 'FAIL F2 on her login screen picks the KDE backup'" \
            "pgrep -u tester -x plasmashell >/dev/null && ! pgrep -u tester -x Hyprland >/dev/null && echo 'PASS the KDE backup sign-in opens KDE Plasma' || echo 'FAIL the KDE backup sign-in opens KDE Plasma'" \
            "pgrep -a -u tester 'Hyprland|quickshell|plasmashell|kwin'" \
            "for s in \$(loginctl list-sessions --no-legend | awk '{print \$1}'); do loginctl show-session \$s -p Type -p Desktop -p Service -p State; done" \
            "echo taylortest | sudo -S sh -c 'tail -20 /tmp/taylor-greeter-scene.log; journalctl -b -u greetd --no-pager | tail -20'"
          cat out/11-kde.txt

      - name: Her TAYLOR desktop fails to start 5 times, and the next sign-in opens KDE by itself (her ruling 2026-11-20)
        run: |
          # From the KDE backup back to her login screen; then five sign-ins whose desktop ends within seconds (as a broken
          # update would), each counted by the login screen's start script.
          python3 .github/vm/vmctl.py run tester taylortest out/12-0.txt "s=\$(loginctl list-sessions --no-legend | awk '\$3==\"tester\" && \$4==\"seat0\" {print \$1}' | head -1); echo session \$s; echo taylortest | sudo -S loginctl terminate-session \$s"
          sleep 40
          python3 .github/vm/vmctl.py shot "$PWD/out/12-0b-after-kde.png"
          python3 .github/vm/vmctl.py run tester taylortest out/12-0b.txt \
            "pgrep -u greetd -f '^(/usr/bin/)?quickshell -p /usr/share/taylor-os/greeter' >/dev/null && echo 'PASS her login screen comes back after the KDE backup' || echo 'FAIL her login screen comes back after the KDE backup'" \
            "echo taylortest | sudo -S sh -c 'ls -la /tmp | grep -i taylor; cat /tmp/taylor-greeter-fails-* /tmp/taylor-desktop-fails; cat /tmp/taylor-greeter-scene.log | tail -30'" \
            "loginctl list-sessions --no-legend; pgrep -a -u tester | head -40; pgrep -a -u greetd" \
            "echo taylortest | sudo -S sh -c 'journalctl -b --since -6min --no-pager | grep -v -iE \"sshd|sudo|audit\" | tail -150'"
          for i in 1 2 3 4 5; do
            python3 .github/vm/vmctl.py type 'taylortest'
            sleep 1
            python3 .github/vm/vmctl.py type '\n'
            python3 .github/vm/vmctl.py run tester taylortest out/12-fail-$i.txt "for t in \$(seq 30); do s=\$(loginctl list-sessions --no-legend | awk '\$3==\"tester\" && \$4==\"seat0\" {print \$1}' | head -1); [ -n \"\$s\" ] && break; sleep 1; done; sleep 3; echo ended \$s; echo taylortest | sudo -S loginctl terminate-session \$s"
            sleep 40
          done
          python3 .github/vm/vmctl.py shot "$PWD/out/12a-kde-picked.png"
          python3 .github/vm/vmctl.py run tester taylortest out/12-picked.txt \
            "echo taylortest | sudo -S cat /tmp/taylor-desktop-fails | grep -qx 5 && echo 'PASS five failed starts of her TAYLOR desktop are counted' || echo 'FAIL five failed starts of her TAYLOR desktop are counted'" \
            "echo taylortest | sudo -S grep -q 'failed to start 5 times; next sign-in opens the KDE backup' /tmp/taylor-greeter-scene.log && echo 'PASS after five her login screen picks KDE by itself' || echo 'FAIL after five her login screen picks KDE by itself'" \
            "echo taylortest | sudo -S sh -c 'cat /tmp/taylor-desktop-fails; journalctl -b -u greetd --no-pager | grep -i \"failed starts\" | tail -8'"
          python3 .github/vm/vmctl.py type 'taylortest'
          sleep 1
          python3 .github/vm/vmctl.py type '\n'
          sleep 60
          python3 .github/vm/vmctl.py shot "$PWD/out/12b-kde.png"
          python3 .github/vm/vmctl.py run tester taylortest out/12-kde.txt \
            "pgrep -u tester -x plasmashell >/dev/null && ! pgrep -u tester -x Hyprland >/dev/null && echo 'PASS that sign-in opens KDE Plasma without F2' || echo 'FAIL that sign-in opens KDE Plasma without F2'" \
            "s=\$(loginctl list-sessions --no-legend | awk '\$3==\"tester\" && \$4==\"seat0\" {print \$1}' | head -1); echo session \$s; echo taylortest | sudo -S loginctl terminate-session \$s"
          sleep 40
          # F2 takes it back: her TAYLOR desktop starts, runs, and the count goes back to none
          python3 .github/vm/vmctl.py key f2
          sleep 3
          python3 .github/vm/vmctl.py shot "$PWD/out/12c-f2-back.png"
          python3 .github/vm/vmctl.py type 'taylortest'
          sleep 1
          python3 .github/vm/vmctl.py type '\n'
          sleep 75
          python3 .github/vm/vmctl.py run tester taylortest out/12-back.txt \
            "pgrep -x -u tester Hyprland >/dev/null && echo 'PASS F2 takes the pick back to her TAYLOR desktop' || echo 'FAIL F2 takes the pick back to her TAYLOR desktop'" \
            "s=\$(loginctl list-sessions --no-legend | awk '\$3==\"tester\" && \$4==\"seat0\" {print \$1}' | head -1); echo session \$s; echo taylortest | sudo -S loginctl terminate-session \$s"
          sleep 15
          python3 .github/vm/vmctl.py run tester taylortest out/12-reset.txt \
            "echo taylortest | sudo -S cat /tmp/taylor-desktop-fails | grep -qx 0 && echo 'PASS a TAYLOR desktop that runs resets the count' || echo 'FAIL a TAYLOR desktop that runs resets the count'" \
            "echo taylortest | sudo -S sh -c 'cat /tmp/taylor-desktop-fails; journalctl -b -u greetd --no-pager | grep -i \"failed starts\" | tail -3'"
          cat out/12-*.txt

      - name: The verdict (fails on any FAIL)
        run: |
          # a result can follow the prompt on the same line: take every "PASS ..." / "FAIL ..." wherever it starts
          # (lines starting "$ " are the typed commands, which contain both words: skip them)
          cat out/0-update.txt out/0b-after-update.txt out/2-checks.txt out/5-desktop-checks.txt out/6-window.txt out/7-closed.txt out/7b-dial.txt out/7e-launcher.txt out/7e2-keys.txt out/7h-launched.txt out/10a-notes.txt out/10b-list.txt out/10c-dismissed.txt out/10d-away.txt out/10e-dial.txt out/10f-five.txt out/9-opening.txt out/11-kde.txt out/12-0b.txt out/12-picked.txt out/12-kde.txt out/12-back.txt out/12-reset.txt 2>/dev/null | tr -d '\r' | grep -av '^\$ ' | grep -av '|| echo' | grep -aoE '(PASS|FAIL) [A-Za-z.][^_]*' | sed 's/ *$//' | sort -u | tee out/verdict.txt
          want=41; [ -n "$UPDATE_TO" ] && want=43
          test "$(grep -c '^PASS ' out/verdict.txt)" -ge $want
          ! grep -q '^FAIL ' out/verdict.txt

      - name: Keep the pictures and logs
        if: always()
        run: |
          cp /tmp/vm-serial.log out/ 2>/dev/null || true
          [ -f /tmp/vm.pid ] && kill "$(cat /tmp/vm.pid)" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vm-test-${{ inputs.tag }}${{ inputs.update_to && format('-to-{0}', inputs.update_to) || '' }}
          path: out/

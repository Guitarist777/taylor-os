name: build taylor-os
on:
  schedule:
    - cron: "00 06 * * *" # every day at 06:00 UTC, after the Universal Blue images build
  push:
    paths-ignore:
      - "**.md"
      - "installer/**"
      - ".github/workflows/installer.yml"
  pull_request:
  workflow_dispatch: # a build can also be started by hand from the Actions tab

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  bluebuild:
    name: Build TAYLOR OS
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        recipe:
          - recipe.yml
    steps:
      - name: Build and sign the image
        uses: blue-build/github-action@v1.13
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true

name: preview the desktop
# After each image build: start the built image, make a test user (so her skel config is copied), run a
# screenless Wayland desktop (sway headless, software drawing; it speaks the same layer-shell as Hyprland),
# start PipeWire, start Quickshell with her config, and take a screenshot. Proves the desktop layer loads
# and the mixer channels exist, and shows what it looks like, before install day. Not a Hyprland test:
# Hyprland needs a GPU; its own config is checked on the real PC.
on:
  workflow_run:
    workflows: ["build taylor-os"]
    types: [completed]
  workflow_dispatch:

jobs:
  preview:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Make room (the image is several GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Pull the image
        run: |
          echo "${{ github.token }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman pull ghcr.io/guitarist777/taylor-os:latest

      - name: Run the desktop and screenshot it
        run: |
          mkdir -p out
          cat > out/run.sh <<'EOS'
          set -x
          dnf install -y -q --setopt=install_weak_deps=False sway grim swaybg dbus-daemon >/dev/null 2>&1 || dnf install -y sway grim swaybg dbus-daemon
          useradd -m tester
          dbus-uuidgen > /etc/machine-id
          ls /usr/share/icons > /out/icon-themes.txt
          # test THIS commit's desktop files, so a desktop fix is previewed without waiting for a new image
          cp -a /repo/files/system/usr/share/taylor-os/quickshell/. /home/tester/.config/quickshell/ && chown -R tester:tester /home/tester/.config/quickshell
          ls -la /home/tester/.config /home/tester/.config/quickshell
          cat > /tmp/sway.conf <<'EOC'
          output HEADLESS-1 resolution 1920x1080
          output * bg /usr/share/backgrounds/taylor/horizon.png fill
          EOC
          chmod 644 /tmp/sway.conf
          mkdir -p /tmp/out && chown tester:tester /tmp/out
          # setpriv, not runuser/su: a container has no login session for PAM to open
          setpriv --reuid=tester --regid=tester --init-groups env HOME=/home/tester USER=tester bash -c '
            cd ~; export XDG_RUNTIME_DIR=/tmp/xdg-tester; mkdir -p -m 700 $XDG_RUNTIME_DIR
            eval $(dbus-launch --sh-syntax)
            pipewire > /tmp/out/pipewire.log 2>&1 &
            sleep 1; wireplumber > /tmp/out/wireplumber.log 2>&1 &
            pipewire-pulse > /tmp/out/pipewire-pulse.log 2>&1 &
            WLR_BACKENDS=headless WLR_RENDERER=pixman WLR_LIBINPUT_NO_DEVICES=1 sway -c /tmp/sway.conf > /tmp/out/sway.log 2>&1 &
            for i in $(seq 1 30); do ls $XDG_RUNTIME_DIR/wayland-* >/dev/null 2>&1 && break; sleep 0.5; done
            export WAYLAND_DISPLAY=$(basename $(ls $XDG_RUNTIME_DIR/wayland-* | grep -v lock | head -1))
            sleep 3
            pw-cli ls Node > /tmp/out/pw-nodes.txt 2>&1
            # the live sky at four hours of her day (Eastern time): afternoon, sunset, night, sunrise
            export TZ=America/New_York
            for H in 13 16.75 22 7; do
              TAYLOR_SKY_HOUR=$H TAYLOR_INTRO=0 QT_QUICK_BACKEND=software quickshell -p ~/.config/quickshell > /tmp/out/quickshell-$H.log 2>&1 &
              QS=$!
              sleep 10
              grim /tmp/out/desktop-$H.png
              kill $QS; wait $QS 2>/dev/null
            done
            # the weather looks (pinned), then one with the live weather, to prove the desktop can ask for it
            for HW in 13:cloudy 13:rain 22:snow; do
              H=${HW%%:*}; WX=${HW##*:}
              TAYLOR_SKY_HOUR=$H TAYLOR_SKY_WX=$WX TAYLOR_INTRO=0 QT_QUICK_BACKEND=software quickshell -p ~/.config/quickshell > /tmp/out/quickshell-$H-$WX.log 2>&1 &
              QS=$!
              sleep 10
              grim /tmp/out/desktop-$H-$WX.png
              kill $QS; wait $QS 2>/dev/null
            done
            TAYLOR_SKY_HOUR=13 TAYLOR_INTRO=0 QT_QUICK_BACKEND=software quickshell -p ~/.config/quickshell > /tmp/out/quickshell-live-weather.log 2>&1 &
            QS=$!
            sleep 15
            grim /tmp/out/desktop-live-weather.png
            kill $QS; wait $QS 2>/dev/null
            # the opening (her animation): still frames through it, over the rainy afternoon sky
            for AT in 1.2 3 4.5 6.5 9 10.9 12.5 14.4 15.8 16.4 16.9; do
              TAYLOR_INTRO=1 TAYLOR_INTRO_AT=$AT TAYLOR_SKY_HOUR=13 TAYLOR_SKY_WX=rain QT_QUICK_BACKEND=software quickshell -p ~/.config/quickshell > /tmp/out/quickshell-intro-$AT.log 2>&1 &
              QS=$!
              sleep 8
              grim /tmp/out/intro-$AT.png
              kill $QS; wait $QS 2>/dev/null
            done
            # and played live once: it must end by itself and leave the desktop
            TAYLOR_INTRO=1 TAYLOR_SKY_HOUR=13 TAYLOR_SKY_WX=rain QT_QUICK_BACKEND=software quickshell -p ~/.config/quickshell > /tmp/out/quickshell-intro-live.log 2>&1 &
            QS=$!
            sleep 6; grim /tmp/out/intro-live-6s.png
            sleep 24; grim /tmp/out/intro-live-30s.png
            kill $QS; wait $QS 2>/dev/null
            cp /tmp/out/desktop-13.png /tmp/out/desktop.png
            cp /tmp/out/quickshell-13.log /tmp/out/quickshell.log
            # ChatMix: its pieces are in the image, and with no base station plugged in it says so and stops cleanly
            { python3 -c "import hid; print(\"hidapi ok\")"; command -v pactl; ls -l /usr/libexec/taylor-chatmix /usr/lib/udev/rules.d/60-taylor-chatmix.rules /usr/lib/systemd/user/taylor-chatmix.service; /usr/libexec/taylor-chatmix; echo "exit=$?"; } > /tmp/out/chatmix.txt 2>&1
          '
          cp -a /tmp/out/. /out/
          grep -o "node.name = \"taylor_[a-z]*\"" /out/pw-nodes.txt | sort -u > /out/channels.txt || true
          EOS
          podman run --rm --privileged -v "$PWD:/repo:ro" -v "$PWD/out:/out" ghcr.io/guitarist777/taylor-os:latest bash /out/run.sh > out/run.log 2>&1 || true
          for f in out/quickshell-*.log; do echo "--- $f"; cat "$f"; done || true
          echo "--- chatmix"; cat out/chatmix.txt || true
          echo "--- mixer channels"; cat out/channels.txt || true
          for H in 13 16.75 22 7 13-cloudy 13-rain 22-snow live-weather; do test -s out/desktop-$H.png; done
          grep -h "taylor-sky: weather" out/quickshell-live-weather.log
          grep -h "taylor-intro" out/quickshell-intro-*.log
          grep -q "taylor-intro: done (played)" out/quickshell-intro-live.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-preview
          path: out/
          retention-days: 14

# TAYLOR OS (2026-11-22): the boot screen hands over to her login screen without a blink.
# A plain "plymouth quit" put the PC's text console back for a moment before her login screen drew. On the test PC
# the picture switched off for about 1.4 s, then showed a black frame. With --retain-splash the boot screen's last
# picture (her dark) stays on the screen until her login screen's first frame replaces it. GNOME's login screen
# hands over the same way. If her login screen ever falls back to the text sign-in, taylor-greeter puts the screen
# back in text mode first.
[Service]
ExecStart=
ExecStart=-/usr/bin/plymouth quit --retain-splash

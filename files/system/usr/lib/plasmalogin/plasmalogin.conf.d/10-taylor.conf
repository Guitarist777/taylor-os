# TAYLOR OS: the login screen starts her TAYLOR desktop (Hyprland, through uwsm). KDE Plasma stays the backup: pick it
# with the "Desktop Session" button on the login screen. (The 2026-11-18 virtual PC test logged in to KDE: with no
# preselected session the login screen falls back to its own memory, which is empty on a new PC, and then to Plasma.)
# Read by plasma-login-manager from its system folder; a file in /etc/plasmalogin.conf.d can override it.
[Greeter]
PreselectedSession=hyprland-uwsm.desktop

# TAYLOR OS: the backup lock screen (her build brief: never lock her out). /usr/libexec/taylor-lock starts this only if
# her own lock screen (the dial) ends while she is still locked. TAYLOR's colours, her clock and date, one thin line to
# type her password on. No red: a wrong password just says "Not quite. Try again."

general {
    hide_cursor = false
    ignore_empty_input = true
}

# no fades: unlocking never waits on drawn frames (2026-11-26: she was let in by her password and the unlock still hung)
animations {
    enabled = false
}

background {
    monitor =
    color = rgb(11, 13, 12)
}

label {
    monitor =
    text = cmd[update:1000] date +"%-I:%M"
    color = rgba(237, 239, 238, 0.95)
    font_size = 96
    font_family = Manrope
    position = 0, 190
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    color = rgba(154, 161, 157, 0.9)
    font_size = 20
    font_family = Manrope
    position = 0, 100
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 44
    outline_thickness = 1
    rounding = 22
    dots_size = 0.22
    dots_spacing = 0.4
    dots_center = true
    outer_color = rgb(79, 179, 134)
    inner_color = rgb(11, 13, 12)
    font_color = rgb(237, 239, 238)
    font_family = Manrope
    check_color = rgb(168, 227, 198)
    fail_color = rgb(154, 161, 157)
    fail_text = Not quite. Try again.
    capslock_color = rgb(168, 227, 198)
    fade_on_empty = false
    placeholder_text = Type your password
    hide_input = false
    position = 0, -40
    halign = center
    valign = center
}

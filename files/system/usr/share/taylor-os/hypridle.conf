# TAYLOR OS: hypridle does ONE job here, locking before the PC sleeps (her setting "lock before sleep", read by
# /usr/libexec/taylor-lock). Her timeout (dim, STILL THERE?, the burst into the lock screen) is drawn by her desktop
# itself (quickshell/Away.qml), so there are no idle listeners here: two lockers never fight.
general {
    lock_cmd = setsid -f /usr/libexec/taylor-lock now
    before_sleep_cmd = setsid -f /usr/libexec/taylor-lock sleep
    inhibit_sleep = 3
}

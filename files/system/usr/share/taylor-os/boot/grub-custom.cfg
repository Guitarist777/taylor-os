# TAYLOR-OS-BOOT-MENU (her pick B5, 2026-11-22). Put here by /usr/libexec/taylor-heal; a copy lives in the image at
# /usr/share/taylor-os/boot/grub-custom.cfg. Delete this file to get the ordinary 1-second menu back.
# The boot menu stays hidden and the PC starts TaylorOS straight away. Hold Shift while it starts to see the menu.
# If the last start did not finish (TaylorOS marks a good start two minutes in: grub-boot-success.timer), the menu shows
# for 5 seconds, so the earlier version is easy to pick. This is the same bookkeeping Fedora's own hidden menu uses.
if [ "${boot_success}" = "1" -o "${boot_indeterminate}" = "1" ]; then
  set taylor_last_ok=1
else
  set taylor_last_ok=0
fi
if [ "${boot_success}" = "1" ]; then
  set boot_indeterminate=0
elif [ "${boot_indeterminate}" = "1" ]; then
  set boot_indeterminate=2
fi
set boot_success=0
save_env boot_success boot_indeterminate
if [ "${taylor_last_ok}" = "1" ]; then
  set timeout_style=hidden
  set timeout=0
  if keystatus --shift; then
    set timeout_style=menu
    set timeout=10
  fi
else
  set timeout_style=menu
  set timeout=5
fi

# TaylorOS terminal (kitty): copy, paste, cut and select all the way Windows does them (her ask, 2026-11-22).
# kitty reads this when the person has no kitty.conf of their own.
#   Ctrl+C   copies the selected text; with nothing selected it stops the running command, as it always did
#   Ctrl+V   pastes                     (right-click pastes too)
#   Ctrl+X   copies the selected text (text in a terminal cannot be cut out, so this is copy)
#   Ctrl+A   copies everything in the window, the whole conversation or output, and says so
#   Selecting with the mouse copies too, so dragging over text is enough
map ctrl+c copy_or_interrupt
map ctrl+v paste_from_clipboard
map ctrl+x copy_or_noop
map ctrl+a launch --type=background --stdin-source=@screen_scrollback sh -c 'wl-copy && notify-send -a Terminal -t 1500 "Copied everything in the window"'
copy_on_select clipboard
mouse_map right press ungrabbed paste_from_clipboard
# the old Linux keys still work
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

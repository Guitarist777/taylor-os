# TAYLOR OS: Hyprland, styled after her mockup "7 · Dock your way + mixer widget" (the TAYLOR theme).
# This file is copied into her home when her account is made; edit ~/.config/hypr/hyprland.conf to change it.

monitor = , preferred, auto, auto

# What starts with the desktop
exec-once = hyprpaper
exec-once = quickshell
exec-once = systemctl --user start hyprpolkitagent
exec-once = hypridle

env = XCURSOR_SIZE, 24
env = QT_QPA_PLATFORMTHEME, kde

general {
    gaps_in = 6
    gaps_out = 14, 14, 14, 14
    border_size = 2
    col.active_border = rgba(4fb386ee)
    col.inactive_border = rgba(ffffff14)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 14
    active_opacity = 1.0
    inactive_opacity = 0.97
    shadow {
        enabled = true
        range = 30
        render_power = 3
        color = rgba(00000073)
    }
    blur {
        enabled = true
        size = 8
        passes = 2
        vibrancy = 0.17
    }
}

# Glass behind the dock, tray, clock and mixer (they draw their own see-through backgrounds)
layerrule = blur, taylor-dock
layerrule = blur, taylor-tray
layerrule = blur, taylor-clock
layerrule = ignorezero, taylor-dock
layerrule = ignorezero, taylor-tray
layerrule = ignorezero, taylor-clock

animations {
    enabled = true
    bezier = calm, 0.22, 1, 0.36, 1
    animation = windows, 1, 5, calm, popin 90%
    animation = windowsOut, 1, 4, calm, popin 90%
    animation = fade, 1, 5, calm
    animation = workspaces, 1, 5, calm, slidefade 15%
    animation = layers, 1, 4, calm, fade
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = rgb(0f1010)
}

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
}

# Keys. SUPER is the Windows key.
$mod = SUPER
bind = $mod, Return, exec, kitty
bind = $mod, Space, exec, fuzzel
bind = $mod, E, exec, dolphin
bind = $mod, B, exec, xdg-open https://
bind = $mod, Q, killactive
bind = $mod, F, fullscreen
bind = $mod, V, togglefloating
bind = $mod, L, exec, hyprlock
bind = $mod SHIFT, M, exit
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Volume and media keys (and the headset's)
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

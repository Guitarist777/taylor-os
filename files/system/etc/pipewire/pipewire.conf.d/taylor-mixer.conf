# TAYLOR mixer channels (the SYS / GAME / VOICE / MUSIC strips of her mixer), a Sonar-style setup.
# Each is a virtual output that apps can be sent to; it plays into whatever the main output is
# (speakers or the GameDAC), so the Speakers / Headphones switch moves every channel at once.
# Which app goes to which channel: /etc/pipewire/pipewire-pulse.conf.d/taylor-mixer-rules.conf
context.modules = [
    { name = libpipewire-module-loopback
      args = {
          node.description = "TAYLOR System"
          capture.props  = { node.name = "taylor_sys"   media.class = "Audio/Sink" audio.position = [ FL FR ] }
          playback.props = { node.name = "taylor_sys.out"   node.passive = true }
      }
    }
    { name = libpipewire-module-loopback
      args = {
          node.description = "TAYLOR Game"
          capture.props  = { node.name = "taylor_game"  media.class = "Audio/Sink" audio.position = [ FL FR ] }
          playback.props = { node.name = "taylor_game.out"  node.passive = true }
      }
    }
    { name = libpipewire-module-loopback
      args = {
          node.description = "TAYLOR Voice"
          capture.props  = { node.name = "taylor_voice" media.class = "Audio/Sink" audio.position = [ FL FR ] }
          playback.props = { node.name = "taylor_voice.out" node.passive = true }
      }
    }
    { name = libpipewire-module-loopback
      args = {
          node.description = "TAYLOR Music"
          capture.props  = { node.name = "taylor_music" media.class = "Audio/Sink" audio.position = [ FL FR ] }
          playback.props = { node.name = "taylor_music.out" node.passive = true }
      }
    }
]

# The TaylorOS mixer's channels (her brief: Master, Game, Chat, Media, Aux, Mic; 2026-11-21).
# Game, Chat, Media and Aux are virtual outputs that apps are sent to. Each plays on into an output of its own
# (her Mixer window, the word under a channel's name: speakers or headset); left alone it follows the main output,
# the one the word in the corner of the desktop mixer picks (and the volume keys move). Master is that main output.
# Mic is the default microphone.
#
#   app -> taylor_game (the channel: its fader and mute) -> taylor_game.out (the Game / Chat balance) -> an output
#
# Which app goes to which channel: the desktop mixer remembers what she drags (~/.config/taylor-os/mixer.json); first
# guesses come from /etc/pipewire/pipewire-pulse.conf.d/taylor-mixer-rules.conf. ChatMix on her headset's base
# station (/usr/libexec/taylor-chatmix) turns the Game / Chat balance.
# The names before 2026-11-21 were taylor_sys / taylor_game / taylor_voice / taylor_music (SYS, GAME, VOICE, MUSIC):
# VOICE is Chat now, MUSIC is Media, SYS is Aux.
# priority 0: a channel is never picked as the main output while a real output exists.
context.modules = [
    { name = libpipewire-module-loopback
      args = {
          node.description = "TaylorOS Game"
          capture.props  = { node.name = "taylor_game"  media.class = "Audio/Sink" audio.position = [ FL FR ] priority.session = 0 priority.driver = 0 }
          playback.props = { node.name = "taylor_game.out"  node.passive = true audio.position = [ FL FR ] node.description = "TaylorOS Game, out" }
      }
    }
    { name = libpipewire-module-loopback
      args = {
          node.description = "TaylorOS Chat"
          capture.props  = { node.name = "taylor_chat"  media.class = "Audio/Sink" audio.position = [ FL FR ] priority.session = 0 priority.driver = 0 }
          playback.props = { node.name = "taylor_chat.out"  node.passive = true audio.position = [ FL FR ] node.description = "TaylorOS Chat, out" }
      }
    }
    { name = libpipewire-module-loopback
      args = {
          node.description = "TaylorOS Media"
          capture.props  = { node.name = "taylor_media" media.class = "Audio/Sink" audio.position = [ FL FR ] priority.session = 0 priority.driver = 0 }
          playback.props = { node.name = "taylor_media.out" node.passive = true audio.position = [ FL FR ] node.description = "TaylorOS Media, out" }
      }
    }
    { name = libpipewire-module-loopback
      args = {
          node.description = "TaylorOS Aux"
          capture.props  = { node.name = "taylor_aux"   media.class = "Audio/Sink" audio.position = [ FL FR ] priority.session = 0 priority.driver = 0 }
          playback.props = { node.name = "taylor_aux.out"   node.passive = true audio.position = [ FL FR ] node.description = "TaylorOS Aux, out" }
      }
    }
]

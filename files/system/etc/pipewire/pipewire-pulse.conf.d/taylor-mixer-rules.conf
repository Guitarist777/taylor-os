# First guesses: which app plays into which TaylorOS mixer channel when it first makes a sound (most apps, Discord,
# Spotify and games under Proton/Wine included, talk to PipeWire through its PulseAudio side, so the rules live here).
# Her own choice wins: dragging an app's name onto another channel in the Mixer window is remembered per app
# (~/.config/taylor-os/mixer.json) and applied each time that app's sound starts. An app named nowhere goes to Media.
pulse.rules = [
    { matches = [ { application.process.binary = "~(?i)(discord|vesktop|webcord|teamspeak|ts3client|mumble|element).*" } ]
      actions = { update-props = { target.object = "taylor_chat" } } }
    { matches = [ { application.process.binary = "~(?i)(spotify|rhythmbox|elisa|tidal-hifi|vlc|mpv|totem|haruna).*" } ]
      actions = { update-props = { target.object = "taylor_media" } } }
    { matches = [ { application.process.binary = "~(?i)(wine64-preloader|wine-preloader|wine64|wine|gamescope).*" } ]
      actions = { update-props = { target.object = "taylor_game" } } }
    { matches = [ { media.role = "Game" } ]
      actions = { update-props = { target.object = "taylor_game" } } }
]

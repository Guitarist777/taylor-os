# Which app plays into which TAYLOR mixer channel (most apps, Discord, Spotify and games under Proton/Wine
# included, talk to PipeWire through its PulseAudio side, so the rules live here).
# Anything not named here plays straight to the main output.
# First version, 2026-11-15: to be checked on the real PC and widened as she uses it.
pulse.rules = [
    { matches = [ { application.process.binary = "~(?i)(discord|vesktop|webcord).*" } ]
      actions = { update-props = { target.object = "taylor_voice" } } }
    { matches = [ { application.process.binary = "~(?i)(spotify|rhythmbox|elisa|tidal-hifi).*" } ]
      actions = { update-props = { target.object = "taylor_music" } } }
    { matches = [ { application.process.binary = "~(?i)(wine64-preloader|wine-preloader|gamescope).*" } ]
      actions = { update-props = { target.object = "taylor_game" } } }
    { matches = [ { media.role = "Game" } ]
      actions = { update-props = { target.object = "taylor_game" } } }
]

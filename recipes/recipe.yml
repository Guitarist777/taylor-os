---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# TAYLOR OS: Bazzite (NVIDIA, open kernel modules) with Hyprland added, and her own login screen. KDE Plasma stays as a backup.
# Published to ghcr.io/guitarist777/taylor-os and signed with the key whose public half is cosign.pub.
name: taylor-os
description: The TAYLOR desktop. Bazzite underneath, Hyprland on top, KDE as the backup.

# Bazzite's NVIDIA image with the open kernel modules: Bazzite's pick for RTX 16xx and newer (her card is an RTX 3080).
# "stable" follows Bazzite's tested weekly release; Fedora 45 as of 2026-11-15.
base-image: ghcr.io/ublue-os/bazzite-nvidia-open
image-version: stable

modules:
  # Bazzite's Fedora 45 build ships Terra's Xwayland, which does not satisfy the Xwayland Hyprland asks for
  # (a known clash, 2026-11). Swap it for Fedora's Xwayland in ONE step.
  # Removing Terra's on its own (as this recipe did until 2026-11-18) also removed everything that needs an Xwayland:
  # KDE Plasma, KWin, the Plasma login screen and gamescope. The PC then booted to a text console with no login screen.
  # A swap keeps them, because Fedora's Xwayland satisfies them too. The check after it fails the build if any is missing.
  - type: script
    snippets:
      - "dnf5 -y swap terra-xorg-x11-server-Xwayland xorg-x11-server-Xwayland"
      - "rpm -q xorg-x11-server-Xwayland plasma-workspace plasma-desktop kwin plasma-login-manager"
      - "rpm -q terra-gamescope || rpm -q gamescope"

  # Hyprland and the small pieces it needs. The sdegler/hyprland COPR builds them for Fedora 45 (checked 2026-11-15).
  - type: dnf
    repos:
      copr:
        - sdegler/hyprland
    install:
      packages:
        - hyprland
        - xdg-desktop-portal-hyprland # screen sharing and file pickers inside Hyprland
        - hyprpolkitagent # the "enter your password" window for admin prompts
        - hyprlock # lock screen
        - hypridle # locks / sleeps when idle
        - hyprpaper # the still Horizon picture under the live sky (shows if the shell ever fails)
        - uwsm # starts Hyprland as a proper session from the login screen
        - kitty # terminal Hyprland's default config opens
        - quickshell # draws her desktop from the mockup: clock, mixer, dock, tray (from Fedora itself)
        - fuzzel # app search on Windows key + Space
        - playerctl # play / pause / next keys
        - qt6-qtsvg # draws the dock and tray line icons (SVG)
        - python3-hidapi # ChatMix: talks to her Arctis Nova Pro Wireless base station
        - pulseaudio-utils # ChatMix: pactl sets the GAME / VOICE channel volumes
        - greetd # runs her login screen (2026-11-19: her own design, drawn by Quickshell; replaces the Plasma login screen)
        - tuigreet # the plain text sign-in, only if her login screen fails twice (never locked out)
        - ntfs-3g # its ntfs-3g.probe tells the Windows-drive mount whether Windows is hibernated (the mount itself uses the kernel's ntfs3)

  # Her desktop (mockup 7, "Dock your way + mixer"): Hyprland and Quickshell settings for every new account (/etc/skel),
  # the Horizon wallpaper, the mockup's fonts (Manrope, Share Tech Mono; OFL), and the TAYLOR mixer channels in PipeWire.
  # Dual boot with Windows: keep the hardware clock in local time like Windows does, so the clock does not jump 5 hours when she switches sides.
  - type: files
    files:
      - source: system
        destination: /

  # Her icon set, Slot-Dark-Icons by L4ki (GPL-3.0), fetched from one pinned commit and checked (files/scripts/slot-icons.sh).
  - type: script
    scripts:
      - slot-icons.sh

  # The taskbar's apps at her sign-in (2026-11-21): Edge, Chrome, Spotify (and Firefox if missing) from Flathub as her own
  # flatpaks, quietly, with a log; EA and Battle.net go through Lutris when she first picks them.
  - type: systemd
    user:
      enabled:
        - taylor-apps-setup.service

  # Start-up repair (2026-11-18): picture mode at boot, and her desktop settings in an account made before the .lua
  # existed (/usr/libexec/taylor-heal changes only what is wrong).
  - type: systemd
    system:
      enabled:
        - taylor-heal.service
        - taylor-windows-mount.service # the Windows drive at /var/mnt/windows for TAYLOR (refuses a hibernated drive)

  # Her login screen (2026-11-19) takes over from the Plasma login screen: greetd becomes the display manager.
  # Plasma's login screen stays installed but no longer starts; KDE is still there to pick from the text sign-in.
  - type: script
    snippets:
      - "systemctl disable plasmalogin.service || true"
      - "rm -f /etc/systemd/system/display-manager.service"
      - "systemctl enable greetd.service"
      - "test \"$(readlink /etc/systemd/system/display-manager.service)\" = /usr/lib/systemd/system/greetd.service"
      - "getent passwd greetd || systemd-sysusers greetd.conf"

  - type: signing # sets up the policy so the PC only accepts images signed with this repo's key

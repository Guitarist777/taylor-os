---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# TAYLOR OS: Bazzite (NVIDIA, open kernel modules) with Hyprland added, and her own login screen. KDE Plasma stays as a backup.
# Published to ghcr.io/guitarist777/taylor-os and signed with the key whose public half is cosign.pub.
name: taylor-os
description: The TAYLOR desktop. Bazzite underneath, Hyprland on top, KDE as the backup.

# Bazzite's NVIDIA image with the open kernel modules: Bazzite's pick for RTX 16xx and newer (her card is an RTX 3080).
# "stable" follows Bazzite's tested weekly release; Fedora 45 as of 2026-11-15.
base-image: ghcr.io/ublue-os/bazzite-nvidia-open
image-version: stable

modules:
  # Bazzite's Fedora 45 build ships Terra's Xwayland, which does not satisfy the Xwayland Hyprland asks for
  # (a known clash, 2026-11). Swap it for Fedora's Xwayland in ONE step.
  # Removing Terra's on its own (as this recipe did until 2026-11-18) also removed everything that needs an Xwayland:
  # KDE Plasma, KWin, the Plasma login screen and gamescope. The PC then booted to a text console with no login screen.
  # A swap keeps them, because Fedora's Xwayland satisfies them too. The check after it fails the build if any is missing.
  - type: script
    snippets:
      - "dnf5 -y swap terra-xorg-x11-server-Xwayland xorg-x11-server-Xwayland"
      - "rpm -q xorg-x11-server-Xwayland plasma-workspace plasma-desktop kwin plasma-login-manager"
      - "rpm -q terra-gamescope || rpm -q gamescope"

  # Hyprland and the small pieces it needs. The sdegler/hyprland COPR builds them for Fedora 45 (checked 2026-11-15).
  # PINNED to the set running on her PC (2026-11-25): that afternoon the COPR rebuilt Hyprland and its family against a new
  # hyprgraphics (0.6 -> 0.7, library .so.5 -> .so.6) but not the title bar plugin, and in the virtual PC (run 45709330733)
  # Hyprland then loaded no plugin: no title bars, no minimise / full screen / close. Move these together, only after the
  # virtual PC's windows checks pass on the new set (the check after this module fails the build on any other version).
  - type: dnf
    repos:
      copr:
        - sdegler/hyprland
    install:
      packages:
        - hyprland-0.57.2-1.fc45
        - hyprgraphics-0.6.0-1.fc45 # the library the pinned Hyprland and the plugin were built with
        - hyprtoolkit-0.6.0-2.fc45 # hyprpolkitagent's toolkit, built with that hyprgraphics
        - xdg-desktop-portal-hyprland-1.5.0-1.fc45 # screen sharing and file pickers inside Hyprland
        - hyprpolkitagent-0.2.0-1.fc45 # the "enter your password" window for admin prompts
        - hyprlock-0.9.7-1.fc45 # lock screen
        - hypridle # locks / sleeps when idle
        - hyprpaper-0.8.5-1.fc45 # the still Horizon picture under the live sky (shows if the shell ever fails)
        - uwsm # starts Hyprland as a proper session from the login screen
        - kitty # terminal Hyprland's default config opens
        - quickshell # draws her desktop from the mockup: clock, mixer, dock, tray (from Fedora itself)
        - fuzzel # app search on Windows key + Space
        - playerctl # play / pause / next keys
        - qt6-qtsvg # draws the dock and tray line icons (SVG)
        - python3-hidapi # ChatMix: talks to her Arctis Nova Pro Wireless base station
        - pulseaudio-utils # pactl (the mixer's checks make pretend outputs with it)
        - ladspa-swh-plugins # the mixer's compressor (SC4) and noise gate (Steve Harris' LADSPA plugins, GPL)
        - mysofa # the mixer's spatial audio: the MIT KEMAR head measurements (default.sofa) for PipeWire's SOFA spatializer
        - greetd # runs her login screen (2026-11-19: her own design, drawn by Quickshell; replaces the Plasma login screen)
        - tuigreet # the plain text sign-in, only if her login screen fails twice (never locked out)
        - ntfs-3g # its ntfs-3g.probe tells the Windows-drive mount whether Windows is hibernated (the mount itself uses the kernel's ntfs3)
        - hyprsunset # Settings > Display, "Warmer colors at night" (Hyprland's own night-light; ddcutil and skopeo, used by Settings too, are already in Bazzite)
        - hyprland-plugin-hyprbars-0.57.0-1.fc45 # a slim title bar with minimise, full screen and close on every window (her pick 2026-11-23)
        - plymouth-plugin-script # draws her boot screen (2026-11-21): her dark with nothing on it (themes/taylor)

  # the pinned Hyprland set, as a check: the build stops if any other version came in
  - type: script
    snippets:
      - "rpm -q hyprland-0.57.2-1.fc45 hyprgraphics-0.6.0-1.fc45 hyprtoolkit-0.6.0-2.fc45 hyprland-plugin-hyprbars-0.57.0-1.fc45 hyprlock-0.9.7-1.fc45 hyprpaper-0.8.5-1.fc45 hyprpolkitagent-0.2.0-1.fc45 xdg-desktop-portal-hyprland-1.5.0-1.fc45"

  # Her desktop (mockup 7, "Dock your way + mixer"): Hyprland and Quickshell settings for every new account (/etc/skel),
  # the Horizon wallpaper, the mockup's fonts (Manrope, Share Tech Mono; OFL), and the TAYLOR mixer channels in PipeWire.
  # Dual boot with Windows: keep the hardware clock in local time like Windows does, so the clock does not jump 5 hours when she switches sides.
  - type: files
    files:
      - source: system
        destination: /

  # Her fonts (Manrope, Share Tech Mono) must be in the system's font list. On an installed PC every file's time is the
  # same fixed time, so fontconfig never notices new fonts by itself: the 2026-11-21 virtual PC had no Manrope at all and
  # the dial's words fell back to Noto Sans. Rebuild the list here, and fail the build if either font is missing.
  - type: script
    snippets:
      - "fc-cache -f -s"
      - "fc-list | grep -q 'Manrope'"
      - "fc-list | grep -q 'Share Tech Mono'"

  # Her icon set, Slot-Dark-Icons by L4ki (GPL-3.0), fetched from one pinned commit and checked (files/scripts/slot-icons.sh).
  - type: script
    scripts:
      - slot-icons.sh

  # Her two cursor sets (her design pack, 2026-11-22: White, the default, and Black), built from her SVGs in
  # /usr/share/taylor-os/cursors into the TAYLOR-White and TAYLOR-Black cursor themes (files/scripts/taylor-cursors.sh).
  - type: script
    scripts:
      - taylor-cursors.sh

  # The taskbar's apps at her sign-in (2026-11-21): Edge, Chrome, Spotify (and Firefox if missing) from Flathub as her own
  # flatpaks, quietly, with a log; EA and Battle.net go through Lutris when she first picks them.
  - type: systemd
    user:
      enabled:
        - taylor-apps-setup.service
        - taylor-gamewatch.service # gaming mode (her pick S4, 2026-11-22): a full-screen game holds back background work

  # A check that the TAYLOR look for her KDE backup session is in place (global theme, colours, Plasma theme, title
  # bars, sky). Her icons come from slot-icons.sh above (files/scripts/slot-dark-icons.sh, the KDE helper's copy of the
  # same pinned download, skips itself when they are already there and is not run).
  - type: script
    snippets:
      - "test -d /usr/share/icons/Slot-Dark-Icons && test -f /usr/share/plasma/look-and-feel/org.taylor-os.kde/metadata.json && test -f /usr/share/color-schemes/TAYLOR.colors && test -f /usr/share/plasma/desktoptheme/TAYLOR/metadata.json && test -f /usr/share/aurorae/themes/TAYLOR/TAYLORrc && test -f /usr/share/wallpapers/TAYLOR-Sky/contents/images/1920x1080.png && test -x /usr/libexec/taylor-kde-look"

  # Start-up repair (2026-11-18): picture mode at boot, and her desktop settings in an account made before the .lua
  # existed (/usr/libexec/taylor-heal changes only what is wrong).
  - type: systemd
    system:
      enabled:
        - taylor-heal.service
        - taylor-windows-mount.service # the Windows drive at /var/mnt/windows for TAYLOR (refuses a hibernated drive)
        - taylor-console.service # the text screen's black is her dark, before the login screen (2026-11-21)
        - taylor-greeter-prefs.service # her "Boot animation" and "Reduce motion" choices reach the login screen (2026-11-21)

  # Her login screen (2026-11-19) takes over from the Plasma login screen: greetd becomes the display manager.
  # Plasma's login screen stays installed but no longer starts; KDE is still there to pick from the text sign-in.
  - type: script
    snippets:
      - "systemctl disable plasmalogin.service || true"
      - "rm -f /etc/systemd/system/display-manager.service"
      - "systemctl enable greetd.service"
      - "test \"$(readlink /etc/systemd/system/display-manager.service)\" = /usr/lib/systemd/system/greetd.service"
      - "getent passwd greetd || systemd-sysusers greetd.conf"

  # Her boot screen (2026-11-21, phase 8): from the firmware's picture straight to her dark (#0B0D0C) with nothing on it,
  # then her opening on the login screen. The boot screen lives inside the initramfs, so the theme is set and the
  # initramfs made again here, the way Bazzite/Universal Blue make theirs (dracut, no host-only, for the image's one
  # kernel). The checks after it fail the build if the initramfs does not carry the theme.
  - type: script
    snippets:
      - "plymouth-set-default-theme taylor"
      - "test \"$(plymouth-set-default-theme)\" = taylor"
      - "kver=$(ls /usr/lib/modules | head -1) && test -d /usr/lib/modules/$kver/kernel && mkdir -p /var/tmp && made=0 && { [ -e /var/roothome ] || { mkdir -p /var/roothome && made=1; }; } && DRACUT_NO_XATTR=1 dracut --tmpdir /tmp --no-hostonly --kver $kver --reproducible --add ostree -f /usr/lib/modules/$kver/initramfs.img && chmod 0600 /usr/lib/modules/$kver/initramfs.img && { [ $made = 0 ] || rmdir /var/roothome; }"
      - "kver=$(ls /usr/lib/modules | head -1) && lsinitrd /usr/lib/modules/$kver/initramfs.img > /tmp/initrd.txt && grep -q 'plymouth/themes/taylor/taylor.script' /tmp/initrd.txt && grep -q 'plymouth/script.so' /tmp/initrd.txt && grep -q 'ostree' /tmp/initrd.txt && grep -q nvidia /tmp/initrd.txt && rm -f /tmp/initrd.txt"

  - type: signing # sets up the policy so the PC only accepts images signed with this repo's key
